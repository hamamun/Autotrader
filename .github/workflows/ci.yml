name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt pytest
      - name: MQL5 structural lint
        run: python tools/mql_lint.py
      - name: Contract tests
        working-directory: python
        run: pytest -q
      - name: Smoke test the pipeline (synthetic data, never used for models)
        working-directory: python
        run: python -m autotrader.cli run --synthetic --bars 6000 --epochs 60 --folds 3 --out-dir /tmp/at-models
      - name: Assert the ONNX contract MT5 depends on
        run: |
          python - <<'EOF'
          import onnx
          m = onnx.load("/tmp/at-models/autotrader_m5.onnx")
          i = m.graph.input[0]; o = m.graph.output[0]
          dims_i = [d.dim_value for d in i.type.tensor_type.shape.dim]
          dims_o = [d.dim_value for d in o.type.tensor_type.shape.dim]
          assert dims_i == [1, 24], dims_i
          assert dims_o == [1, 3], dims_o
          print("onnx contract ok:", dims_i, "->", dims_o)
          EOF
