[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader-research"
version = "0.1.0"
description = "Research pipeline that trains and exports the direction model used by the Autotrader MT5 expert advisor"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "onnx>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "onnxruntime>=1.16"]
windows = ["MetaTrader5>=5.0"]

[project.scripts]
autotrader = "autotrader.cli:main"

[tool.setuptools]
packages = ["autotrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
